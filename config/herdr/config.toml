onboarding = false

[theme]
name = "vesper"

[theme.custom]
panel_bg = "none"
surface0 = "#202020"
surface1 = "#2a2a2a"
surface_dim = "#141414"
overlay0 = "#757575"
overlay1 = "#8e8e8e"
text = "#bbbbbb"
subtext0 = "#a0a0a0"
red = "#de6e7c"
green = "#819b69"
yellow = "#b77e64"
blue = "#6099c0"
mauve = "#b279a7"
teal = "#66a5ad"
peach = "#b77e64"
accent = "#819b69"

[ui]
prompt_new_tab_name = false
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
pane_gaps = false
copy_on_select = true

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["terminal_title_stripped"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace", "branch", "git_status"],
]

[ui.toast]
delivery = "system"

[ui.toast.clipboard]
enabled = false

[ui.sound]
enabled = false
